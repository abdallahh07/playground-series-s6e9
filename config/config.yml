data:
  raw_dir: "data/raw"
  train_file: "train.csv"
  test_file: "test.csv"
  sample_submission_file: "sample_submission.csv"

target: "Will_Buy_EV"

features:
  numeric:
    - Age
    - Annual_Income_USD
    - Daily_Commute_km
    - Number_of_Cars_Owned
    - Charging_Stations_Near_Home
    - Charging_Stations_Near_Work
    - Environmental_Concern_Level
  categorical:
    - Gender
    - City_Type
    - Current_Car_Type
  binary:
    - Home_Charging_Possible
    - Subsidy_Available
  ordinal:
    Range_Anxiety_Level:
      Low: 0
      Medium: 1
      High: 2
  engineered:
    - Charging_Station_Diff
    - Charging_Station_Ratio
    - Cars_Per_ChargingHome
    - Commute_Per_ChargingWork
    - Income_Per_Car
    - Commute_Per_Car
    - Income_Per_Commute
    - High_EnvConcern
    - High_Income
    - Long_Commute
    - Multi_Car
    - Total_Charging_Access
    - Subsidy_HomeCharging
    - Anxiety_HomeCharging
    - ChargingHome_x_Subsidy
    - ChargingWork_x_Subsidy

model:
  type: "lightgbm"
  params:
    n_estimators: 1000
    max_depth: 3
    learning_rate: 0.1
    num_leaves: 31
    subsample: 0.6
    colsample_bytree: 0.8
    random_state: 42
    verbose: -1

training:
  test_size: 0.2
  random_state: 42
  stratify: true
  cv_folds: 5

paths:
  model_dir: "trained_model"
  model_filename: "model.pkl"
  submission_dir: "submissions"
